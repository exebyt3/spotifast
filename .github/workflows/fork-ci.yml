name: Fork CI

# The fork's quick check: the Linux tests with default features only.
# ci.yml stays upstream's four-system matrix for a full run on demand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev ninja-build
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: fork-test-v1
      - name: Tests
        run: mbx test --locked --all-targets
